<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Three concurrent lookups during one WhatsApp voice call</title>
<desc id="desc">A horizontal duration chart from one real answered call. Weather took 18.110 seconds, opening hours 23.814 seconds, and shop checkout 34.498 seconds. All three began at zero seconds. The arithmetic sum is 76.422 seconds, not a measured sequential run.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4F7F6"/><stop offset="1" stop-color="#E6F2F2"/></linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0D6571"/><stop offset="1" stop-color="#69AEB3"/></linearGradient>
</defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/>
<text x="58" y="58" fill="#0D6571" font-family="IBM Plex Mono,monospace" font-size="15" font-weight="600" letter-spacing="2">WHATSAPP PLUS / REAL-CALL DATA</text>
<text x="58" y="112" fill="#19313B" font-family="Manrope,Arial,sans-serif" font-size="36" font-weight="800" letter-spacing="-1.5">Three lookups. One call. All started together.</text>
<text x="58" y="148" fill="#596D75" font-family="Manrope,Arial,sans-serif" font-size="17">Measured durations of the full Hermes lookup turns — not voice-response latency.</text>
<text x="249" y="202" fill="#596D75" font-family="IBM Plex Mono,monospace" font-size="12">SECONDS FROM THE QUESTION</text>
<g stroke="#D9E1E0" stroke-width="1">
  <path d="M250 220v262M430 220v262M610 220v262M790 220v262M970 220v262"/>
</g>
<g fill="#596D75" font-family="IBM Plex Mono,monospace" font-size="12" text-anchor="middle">
  <text x="250" y="505">0</text><text x="430" y="505">10</text><text x="610" y="505">20</text><text x="790" y="505">30</text><text x="970" y="505">40</text>
</g>
<g fill="#334B56" font-family="Manrope,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="end">
  <text x="226" y="273">Weather</text><text x="226" y="353">Opening hours</text><text x="226" y="433">Shop checkout</text>
</g>
<g fill="url(#bar)">
  <rect x="250" y="244" width="326" height="38" rx="8"/>
  <rect x="250" y="324" width="429" height="38" rx="8"/>
  <rect x="250" y="404" width="621" height="38" rx="8"/>
</g>
<g fill="#19313B" font-family="IBM Plex Mono,monospace" font-size="14" font-weight="600">
  <text x="590" y="269">18.110 s</text><text x="693" y="349">23.814 s</text><text x="885" y="429">34.498 s</text>
</g>
<rect x="58" y="536" width="1084" height="74" rx="16" fill="#ffffff" stroke="#D9E1E0"/>
<text x="82" y="566" fill="#19313B" font-family="Manrope,Arial,sans-serif" font-size="15" font-weight="750">One real answered call · n = 3 lookups</text>
<text x="82" y="590" fill="#596D75" font-family="Manrope,Arial,sans-serif" font-size="13">All started at 0 s. Their 76.422 s sum is arithmetic only — no sequential run was measured.</text>
<text x="58" y="642" fill="#596D75" font-family="IBM Plex Mono,monospace" font-size="11">SOURCE: docs/call_metrics.json + docs/make_charts.py  ·  SMALL SAMPLE, NOT A BENCHMARK</text>
</svg>
