<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">GOAT's seven bounded public-web tools</title>
<desc id="desc">A source-derived map of seven tools: search up to five results; extract one public HTTPS page up to 8,000 characters; crawl same-origin pages to depth two and at most ten pages; probe reachability without a page body; answer extractively from up to five Wikipedia snippets; filtered search that excludes missing metadata; and one vertical metadata source such as Crossref, GDELT, or Wikimedia Commons. GOAT is a local release candidate, not an activated plugin.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4F7F6"/><stop offset="1" stop-color="#E6F2F2"/></linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#19313B" flood-opacity=".08"/></filter>
</defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/>
<text x="58" y="58" fill="#0D6571" font-family="IBM Plex Mono,monospace" font-size="15" font-weight="600" letter-spacing="2">GOAT / SEVEN TOOL CONTRACTS</text>
<text x="58" y="112" fill="#19313B" font-family="Manrope,Arial,sans-serif" font-size="36" font-weight="800" letter-spacing="-1.5">Seven tools. Seven explicit boundaries.</text>
<text x="58" y="148" fill="#596D75" font-family="Manrope,Arial,sans-serif" font-size="17">A map of the README contract — not a live execution trace.</text>
<g filter="url(#shadow)">
  <rect x="58" y="190" width="340" height="104" rx="16" fill="#ffffff" stroke="#D9E1E0"/><rect x="430" y="190" width="340" height="104" rx="16" fill="#ffffff" stroke="#D9E1E0"/><rect x="802" y="190" width="340" height="104" rx="16" fill="#ffffff" stroke="#D9E1E0"/>
  <rect x="58" y="316" width="340" height="104" rx="16" fill="#ffffff" stroke="#D9E1E0"/><rect x="430" y="316" width="340" height="104" rx="16" fill="#ffffff" stroke="#D9E1E0"/><rect x="802" y="316" width="340" height="104" rx="16" fill="#ffffff" stroke="#D9E1E0"/>
  <rect x="58" y="442" width="340" height="104" rx="16" fill="#ffffff" stroke="#D9E1E0"/>
</g>
<g font-family="IBM Plex Mono,monospace" font-size="11" font-weight="600" fill="#0D6571">
  <text x="82" y="222">01 / goat_search</text><text x="454" y="222">02 / goat_extract</text><text x="826" y="222">03 / goat_crawl</text>
  <text x="82" y="348">04 / goat_probe</text><text x="454" y="348">05 / goat_answer</text><text x="826" y="348">06 / goat_filtered_search</text><text x="82" y="474">07 / goat_vertical_search</text>
</g>
<g font-family="Manrope,Arial,sans-serif" font-size="14" fill="#334B56">
  <text x="82" y="254">DuckDuckGo HTML · at most 5 results</text><text x="454" y="254">One public HTTPS page · ≤8,000 chars</text><text x="826" y="254">Same-origin · depth ≤2 · pages ≤10</text>
  <text x="82" y="380">Reachability only · returns no body</text><text x="454" y="380">≤5 Wikipedia snippets · extractive</text><text x="826" y="380">Time/domain/language filters · missing metadata excluded</text>
  <text x="82" y="506">One metadata vertical: Crossref, GDELT, or Commons</text>
</g>
<rect x="430" y="442" width="712" height="104" rx="16" fill="#19313B"/>
<text x="456" y="476" fill="#D6EC6B" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="600" letter-spacing="1.1">THE ROUTER DOESN'T MAKE EVIDENCE TRUE</text>
<text x="456" y="508" fill="#ffffff" font-family="Manrope,Arial,sans-serif" font-size="17" font-weight="750">It makes the retrieval path smaller — and the stopping point visible.</text>
<rect x="58" y="574" width="1084" height="46" rx="12" fill="#F1ECF8"/>
<text x="80" y="603" fill="#614894" font-family="IBM Plex Mono,monospace" font-size="12" font-weight="600">STATUS: LOCAL CANDIDATE 0.2.0 · NOT PUBLISHED OR ACTIVATED</text>
<text x="58" y="650" fill="#596D75" font-family="IBM Plex Mono,monospace" font-size="10">SOURCE: PROJECT README + RELEASE-CANDIDATE.md  ·  EDITORIAL MAP, NOT A BENCHMARK</text>
</svg>
