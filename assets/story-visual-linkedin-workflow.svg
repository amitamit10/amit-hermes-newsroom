<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">The source-first LinkedIn publishing workflow</title>
<desc id="desc">An editorial workflow map: research primary sources, verify claims, draft, prepare genuine visuals, keep a human approval step, publish through an authorized connection, read back the post, and use aggregate analytics as a cautious next experiment. This is a synthesis of two skill repositories, not a measured funnel.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4F7F6"/><stop offset="1" stop-color="#E6F2F2"/></linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#19313B" flood-opacity=".09"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#0D6571"/></marker>
</defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/>
<text x="58" y="58" fill="#0D6571" font-family="IBM Plex Mono,monospace" font-size="15" font-weight="600" letter-spacing="2">LINKEDIN POSTS / EDITORIAL LOOP</text>
<text x="58" y="112" fill="#19313B" font-family="Manrope,Arial,sans-serif" font-size="36" font-weight="800" letter-spacing="-1.5">A post is the last step, not the whole system.</text>
<text x="58" y="148" fill="#596D75" font-family="Manrope,Arial,sans-serif" font-size="17">Two repositories make the chain visible — with a human-owned publish boundary.</text>
<g filter="url(#shadow)">
  <rect x="58" y="208" width="239" height="180" rx="18" fill="#ffffff" stroke="#D9E1E0"/>
  <rect x="330" y="208" width="239" height="180" rx="18" fill="#ffffff" stroke="#D9E1E0"/>
  <rect x="602" y="208" width="239" height="180" rx="18" fill="#ffffff" stroke="#D9E1E0"/>
  <rect x="874" y="208" width="268" height="180" rx="18" fill="#19313B"/>
</g>
<text x="82" y="246" fill="#0D6571" font-family="IBM Plex Mono,monospace" font-size="12" font-weight="600">01 / FIND</text>
<text x="82" y="284" fill="#19313B" font-family="Manrope,Arial,sans-serif" font-size="21" font-weight="800">Research</text>
<text x="82" y="317" fill="#596D75" font-family="Manrope,Arial,sans-serif" font-size="14">Primary sources first.</text>
<text x="82" y="342" fill="#596D75" font-family="Manrope,Arial,sans-serif" font-size="14">Separate fact, estimate,</text>
<text x="82" y="365" fill="#596D75" font-family="Manrope,Arial,sans-serif" font-size="14">and interpretation.</text>
<text x="354" y="246" fill="#0D6571" font-family="IBM Plex Mono,monospace" font-size="12" font-weight="600">02 / MAKE</text>
<text x="354" y="284" fill="#19313B" font-family="Manrope,Arial,sans-serif" font-size="21" font-weight="800">Draft + visual</text>
<text x="354" y="317" fill="#596D75" font-family="Manrope,Arial,sans-serif" font-size="14">Build a clear hook.</text>
<text x="354" y="342" fill="#596D75" font-family="Manrope,Arial,sans-serif" font-size="14">Use genuine charts;</text>
<text x="354" y="365" fill="#596D75" font-family="Manrope,Arial,sans-serif" font-size="14">never invent results.</text>
<text x="626" y="246" fill="#0D6571" font-family="IBM Plex Mono,monospace" font-size="12" font-weight="600">03 / CHECK</text>
<text x="626" y="284" fill="#19313B" font-family="Manrope,Arial,sans-serif" font-size="21" font-weight="800">Human review</text>
<text x="626" y="317" fill="#596D75" font-family="Manrope,Arial,sans-serif" font-size="14">Verify every claim,</text>
<text x="626" y="342" fill="#596D75" font-family="Manrope,Arial,sans-serif" font-size="14">author, media, and</text>
<text x="626" y="365" fill="#596D75" font-family="Manrope,Arial,sans-serif" font-size="14">intended visibility.</text>
<text x="898" y="246" fill="#D6EC6B" font-family="IBM Plex Mono,monospace" font-size="12" font-weight="600">04 / PUBLISH</text>
<text x="898" y="284" fill="#ffffff" font-family="Manrope,Arial,sans-serif" font-size="21" font-weight="800">Only when asked</text>
<text x="898" y="317" fill="#E6F2F2" font-family="Manrope,Arial,sans-serif" font-size="14">Authorized connection.</text>
<text x="898" y="342" fill="#E6F2F2" font-family="Manrope,Arial,sans-serif" font-size="14">Then read back the exact</text>
<text x="898" y="365" fill="#E6F2F2" font-family="Manrope,Arial,sans-serif" font-size="14">post and attached media.</text>
<path d="M302 298h22M574 298h22M846 298h22" fill="none" stroke="#0D6571" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="58" y="432" width="1084" height="130" rx="18" fill="#ffffff" stroke="#D9E1E0"/>
<text x="84" y="472" fill="#596D75" font-family="IBM Plex Mono,monospace" font-size="12" font-weight="600" letter-spacing="1.2">AFTER PUBLICATION / LEARN CAREFULLY</text>
<text x="84" y="510" fill="#19313B" font-family="Manrope,Arial,sans-serif" font-size="18" font-weight="750">Readback → aggregate analytics → one bounded experiment → back to research</text>
<text x="84" y="538" fill="#596D75" font-family="Manrope,Arial,sans-serif" font-size="14">Low-volume rates are clues, not laws; the expanded skill says not to promise read or analytics access.</text>
<path d="M1012 570c-10 42-82 54-150 54H302c-93 0-142-21-143-49" fill="none" stroke="#8fa5d2" stroke-width="2" stroke-dasharray="5 8" marker-end="url(#arrow)"/>
<text x="58" y="642" fill="#596D75" font-family="IBM Plex Mono,monospace" font-size="11">SOURCE: TWO PUBLIC HERMES SKILL REPOSITORIES  ·  EDITORIAL SYNTHESIS, NOT A MEASURED FUNNEL</text>
</svg>
